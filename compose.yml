services:
  api:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - ${PORT}:${PORT}
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      - migrate
      - seed

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - ${DB_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate
    volumes:
      - ./backend/migrations:/migrations
    depends_on:
      db:
        condition: service_healthy
    command:
      - -path=/migrations/
      - -database=postgres://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}
      - up

  seed:
    image: postgres:15-alpine
    volumes:
      - ./backend/seeds:/seeds
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    command: >
      sh -c "psql -h db -U ${DB_USER} -d ${DB_NAME} -f /seeds/001_seed_data.sql"
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:${PORT}
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
