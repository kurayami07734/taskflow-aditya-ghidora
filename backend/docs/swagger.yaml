basePath: /
definitions:
  handlers.createProjectRequest:
    properties:
      description:
        type: string
      name:
        minLength: 3
        type: string
    required:
    - name
    type: object
  handlers.createTaskRequest:
    properties:
      assignee_id:
        type: string
      description:
        type: string
      due_date:
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        type: string
      title:
        minLength: 3
        type: string
    required:
    - title
    type: object
  handlers.listProjectsResponse:
    properties:
      pagination:
        $ref: '#/definitions/utils.Pagination'
      projects:
        items:
          $ref: '#/definitions/handlers.projectResponse'
        type: array
    type: object
  handlers.listTasksResponse:
    properties:
      pagination:
        $ref: '#/definitions/utils.Pagination'
      tasks:
        items:
          $ref: '#/definitions/handlers.taskResponse'
        type: array
    type: object
  handlers.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.loginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/handlers.userResponse'
    type: object
  handlers.projectResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
    type: object
  handlers.projectWithTasksResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
      pagination:
        $ref: '#/definitions/utils.Pagination'
      tasks:
        items:
          $ref: '#/definitions/handlers.taskResponse'
        type: array
    type: object
  handlers.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  handlers.registerResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/handlers.userResponse'
    type: object
  handlers.taskResponse:
    properties:
      assignee_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      due_date:
        type: string
      id:
        type: string
      priority:
        type: string
      project_id:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  handlers.updateProjectRequest:
    properties:
      description:
        type: string
      name:
        minLength: 3
        type: string
    type: object
  handlers.updateTaskRequest:
    properties:
      assignee_id:
        type: string
      description:
        type: string
      due_date:
        type: string
      priority:
        enum:
        - low
        - medium
        - high
        type: string
      status:
        enum:
        - todo
        - in_progress
        - done
        type: string
      title:
        minLength: 3
        type: string
    type: object
  handlers.userResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  utils.BadRequestError:
    properties:
      error:
        type: string
    type: object
  utils.ForbiddenError:
    properties:
      error:
        type: string
    type: object
  utils.InternalError:
    properties:
      error:
        type: string
    type: object
  utils.NotFoundError:
    properties:
      error:
        type: string
    type: object
  utils.Pagination:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  utils.UnauthorizedError:
    properties:
      error:
        type: string
    type: object
host: localhost:5000
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: API for managing projects and tasks
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Taskflow API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.loginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.BadRequestError'
      summary: Login user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user with name, email and password
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.registerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.BadRequestError'
      summary: Register a new user
      tags:
      - auth
  /projects:
    get:
      consumes:
      - application/json
      description: Get all projects for the authenticated user with pagination
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.listProjectsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.UnauthorizedError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.InternalError'
      security:
      - BearerAuth: []
      summary: List projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Create a new project
      parameters:
      - description: Create project request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.createProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.projectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.BadRequestError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.UnauthorizedError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.InternalError'
      security:
      - BearerAuth: []
      summary: Create a project
      tags:
      - projects
  /projects/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a project by ID
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.UnauthorizedError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ForbiddenError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.NotFoundError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.InternalError'
      security:
      - BearerAuth: []
      summary: Delete a project
      tags:
      - projects
    get:
      consumes:
      - application/json
      description: Get a specific project by ID with its tasks
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.projectWithTasksResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.BadRequestError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.UnauthorizedError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ForbiddenError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.NotFoundError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.InternalError'
      security:
      - BearerAuth: []
      summary: Get a project
      tags:
      - projects
    patch:
      consumes:
      - application/json
      description: Update an existing project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Update project request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.updateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.projectResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.BadRequestError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.UnauthorizedError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ForbiddenError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.NotFoundError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.InternalError'
      security:
      - BearerAuth: []
      summary: Update a project
      tags:
      - projects
  /projects/{id}/tasks:
    get:
      consumes:
      - application/json
      description: Get all tasks for a project with optional filters and pagination
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: limit
        type: integer
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by assignee ID
        in: query
        name: assignee
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.listTasksResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.BadRequestError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.UnauthorizedError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ForbiddenError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.NotFoundError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.InternalError'
      security:
      - BearerAuth: []
      summary: List tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Create a new task in a project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Create task request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.createTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.taskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.BadRequestError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.UnauthorizedError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ForbiddenError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.NotFoundError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.InternalError'
      security:
      - BearerAuth: []
      summary: Create a task
      tags:
      - tasks
  /tasks/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a task by ID
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.UnauthorizedError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ForbiddenError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.NotFoundError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.InternalError'
      security:
      - BearerAuth: []
      summary: Delete a task
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: Update an existing task
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Update task request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.updateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.taskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.BadRequestError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.UnauthorizedError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.ForbiddenError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.NotFoundError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.InternalError'
      security:
      - BearerAuth: []
      summary: Update a task
      tags:
      - tasks
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
